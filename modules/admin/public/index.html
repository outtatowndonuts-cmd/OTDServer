<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTD — Admin</title>
    <style>
      /* ── Reset & Base ───────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: #0f1117;
        color: #e4e6eb;
        line-height: 1.5;
      }
      a {
        color: #4dabf7;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      /* ── Layout ─────────────────────────────────────────────── */
      .admin-shell {
        display: grid;
        grid-template-columns: 220px 1fr;
        grid-template-rows: 56px 1fr;
        height: 100vh;
      }
      .admin-topbar {
        grid-column: 1 / -1;
        background: #1a1d2e;
        border-bottom: 1px solid #2a2d3a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
      }
      .admin-topbar h1 {
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
      }
      .admin-topbar .exit-btn {
        background: #e74c3c;
        color: #fff;
        border: none;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 0.85rem;
        cursor: pointer;
        font-weight: 600;
      }
      .admin-topbar .exit-btn:hover {
        background: #c0392b;
      }

      .admin-sidebar {
        background: #161828;
        border-right: 1px solid #2a2d3a;
        padding: 16px 0;
        overflow-y: auto;
      }
      .admin-sidebar a {
        display: block;
        padding: 12px 24px;
        color: #9ca3af;
        font-size: 0.9rem;
        font-weight: 500;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .admin-sidebar a:hover,
      .admin-sidebar a.active {
        background: #1e2130;
        color: #fff;
        text-decoration: none;
      }
      .admin-sidebar a.active {
        border-left: 3px solid #4dabf7;
      }

      .admin-content {
        padding: 24px 32px;
        overflow-y: auto;
      }

      /* ── Cards & Stats ──────────────────────────────────────── */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 28px;
      }
      .stat-card {
        background: #1e2130;
        border: 1px solid #2a2d3a;
        border-radius: 12px;
        padding: 20px;
      }
      .stat-card .label {
        font-size: 0.8rem;
        color: #9ca3af;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }
      .stat-card .value {
        font-size: 1.6rem;
        font-weight: 700;
        color: #fff;
      }

      /* ── Tables ──────────────────────────────────────────────── */
      .admin-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      .admin-table th,
      .admin-table td {
        text-align: left;
        padding: 10px 14px;
        border-bottom: 1px solid #2a2d3a;
        font-size: 0.88rem;
      }
      .admin-table th {
        color: #9ca3af;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
      }
      .admin-table tr:hover td {
        background: #1a1d2e;
      }

      /* ── Badges ──────────────────────────────────────────────── */
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .badge-green {
        background: #064e3b;
        color: #6ee7b7;
      }
      .badge-yellow {
        background: #78350f;
        color: #fcd34d;
      }
      .badge-red {
        background: #7f1d1d;
        color: #fca5a5;
      }
      .badge-blue {
        background: #1e3a5f;
        color: #93c5fd;
      }
      .badge-gray {
        background: #374151;
        color: #d1d5db;
      }
      .badge-orange {
        background: #92400e;
        color: #fde68a;
      }

      /* ── Action buttons (applications) ──────────────────────── */
      .btn-action {
        padding: 4px 12px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 600;
      }
      .btn-action:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-approve {
        background: #166534;
        color: #d1fae5;
      }
      .btn-approve:hover:not(:disabled) {
        background: #15803d;
      }
      .btn-deny {
        background: #7f1d1d;
        color: #fee2e2;
      }
      .btn-deny:hover:not(:disabled) {
        background: #991b1b;
      }

      /* ── Filters ────────────────────────────────────────────── */
      .filter-bar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        align-items: center;
      }
      .filter-bar select,
      .filter-bar input {
        background: #1e2130;
        border: 1px solid #3a3d4a;
        color: #e4e6eb;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
      }
      .filter-bar button {
        background: #4dabf7;
        color: #000;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }
      .filter-bar button:hover {
        background: #339af0;
      }

      /* ── Role select ────────────────────────────────────────── */
      .role-select {
        background: #1e2130;
        border: 1px solid #3a3d4a;
        color: #e4e6eb;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 0.82rem;
        cursor: pointer;
      }

      /* ── Section headings ───────────────────────────────────── */
      .section-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 16px;
      }

      /* ── Loading / Error ────────────────────────────────────── */
      .loading {
        color: #9ca3af;
        padding: 40px;
        text-align: center;
      }
      .error-msg {
        color: #fca5a5;
        padding: 12px;
        background: #7f1d1d;
        border-radius: 8px;
        margin-bottom: 16px;
      }

      /* ── Responsive ─────────────────────────────────────────── */
      @media (max-width: 768px) {
        .admin-shell {
          grid-template-columns: 1fr;
        }
        .admin-sidebar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
